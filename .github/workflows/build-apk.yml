name: Build HB Browser APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK: $SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-35" || { echo "::error::Android SDK Platform 35 is not installed on this runner"; ls -la "$SDK_ROOT/platforms" || true; exit 1; }
          test -d "$SDK_ROOT/build-tools/35.0.0" || { echo "::error::Android Build Tools 35.0.0 are not installed on this runner"; ls -la "$SDK_ROOT/build-tools" || true; exit 1; }
          echo "Android SDK Platform 35 and Build Tools 35.0.0 are available."

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
