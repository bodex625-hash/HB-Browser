name: Build HB Browser Chromium Prototype

on:
  push:
    branches: [ "chromium-prototype" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools "ndk;27.2.12479018"

      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Fetch tun2socks native source
        run: |
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git app/src/main/jni/hev-socks5-tunnel

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Browser-Chromium-prototype-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
