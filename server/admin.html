<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Browser - إدارة الأكواد</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#eee;font-family:Arial,sans-serif;padding:22px}main{max-width:520px;margin:35px auto;background:#17191d;border:1px solid #66552a;border-radius:18px;padding:22px}h2{color:#d4af37;text-align:center}label{display:block;margin:16px 0 7px}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #66552a;background:#0f1115;color:#fff;font-size:16px}button{background:#d4af37;color:#090a0c;font-weight:bold;border:0;margin-top:14px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0d10;padding:14px;border-radius:10px;min-height:50px}small{color:#aaa}</style></head><body><main>
<h2>HB Browser | إدارة الأكواد</h2><label>مفتاح الإدارة</label><input id="key" type="password" autocomplete="off" placeholder="أدخل مفتاح الإدارة">
<label>مدة الاشتراك</label><select id="days"><option value="3">3 أيام تجريبي</option><option value="30">30 يوماً</option><option value="90">90 يوماً</option><option value="180">180 يوماً</option><option value="365">365 يوماً</option><option value="0">دائم</option></select>
<button onclick="createCode()">إنشاء كود جديد</button><label>إيقاف كود</label><input id="revoke" placeholder="HB-XXXX-XXXX-XXXX"><button onclick="revokeCode()">إيقاف الكود</button>
<label>النتيجة</label><pre id="out">الأكواد الجديدة تظهر هنا مرة واحدة. احتفظ بها وأرسلها للمستخدم.</pre><small>لا تشارك مفتاح الإدارة مع العملاء. استخدم HTTPS فقط.</small></main>
<script>const endpoint='api.php';async function send(action,extra){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,admin_key:document.getElementById('key').value,...extra})});return await r.json()}
async function createCode(){try{const x=await send('admin_create',{duration_days:Number(document.getElementById('days').value)});document.getElementById('out').textContent=x.ok?('الكود: '+x.code+'\nالمدة: '+(x.duration_days||'دائم')+' يوم\nانسخه الآن؛ لن يظهر كاملاً مرة أخرى.'):x.message}catch(e){document.getElementById('out').textContent='تعذر الاتصال بالخادم: '+e}}
async function revokeCode(){try{const x=await send('admin_revoke',{code:document.getElementById('revoke').value});document.getElementById('out').textContent=x.message}catch(e){document.getElementById('out').textContent='تعذر الاتصال بالخادم: '+e}}</script></body></html>
